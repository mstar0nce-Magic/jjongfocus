name: Build JjongKeep Share Connector

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-share-connector/**'
      - '.github/workflows/build-share-connector.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-share-connector
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jjongkeep-share-connector
          path: android-share-connector/app/build/outputs/apk/debug/app-debug.apk
