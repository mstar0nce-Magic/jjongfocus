<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#234734"><title>쫑글킵 공유진단 v0.2.1</title><link rel="manifest" href="manifest.webmanifest?v=021"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f3;color:#202520;font-family:Arial,'Noto Sans KR',sans-serif}.app{max-width:680px;margin:auto;padding:28px 18px 80px}h1{font-size:30px;margin:0 0 5px}h1 small{font-size:17px;color:#788078}p{line-height:1.6;color:#69716b}.card{margin-top:22px;background:#fff;border:1px solid #dfe4df;border-radius:22px;padding:18px}.status{font-size:20px;font-weight:900;margin-bottom:14px}.row{padding:9px 0;border-bottom:1px solid #edf0ed}.row:last-child{border:0}.key{font-size:12px;color:#818981;margin-bottom:4px}.val{font-size:15px;word-break:break-all;white-space:pre-wrap}.ok{color:#176436}.bad{color:#a62e2e}.preview img{max-width:100%;border-radius:16px;margin-top:12px}.hint{margin-top:20px;padding:15px;border-radius:16px;background:#edf3ee;font-size:14px;line-height:1.6}.btn{display:block;width:100%;margin-top:14px;border:0;border-radius:15px;padding:14px;background:#234734;color:#fff;font-weight:900;font-size:16px}</style></head><body><div class="app"><h1>쫑글킵 <small>공유진단 v0.2.1</small></h1><p>지금은 다른 기능을 잠시 빼고, 휴대폰이 쫑글킵에 실제로 무엇을 보내는지만 확인합니다.</p><section class="card"><div id="status" class="status">대기 중</div><div id="details"><div class="row"><div class="key">테스트 방법</div><div class="val">갤러리 또는 캡처 화면에서 사진 1장 → 공유 → 쫑글킵</div></div></div><div id="preview" class="preview"></div></section><div class="hint">공유 후 이 화면에 <b>POST 수신 / Content-Type / title / text / url / 파일 개수 / 파일명 / MIME / 용량</b>이 표시됩니다. 실패해도 실제 오류 이름과 메시지를 숨기지 않고 보여줍니다.</div><button class="btn" onclick="location.reload()">화면 새로고침</button></div><script>const p=new URLSearchParams(location.search);const raw=p.get('diag');if(raw){try{const d=JSON.parse(decodeURIComponent(escape(atob(raw.replace(/-/g,'+').replace(/_/g,'/')))));document.querySelector('#status').textContent=d.ok?'✓ 공유 요청 수신 성공':'✕ 공유 처리 오류';document.querySelector('#status').className='status '+(d.ok?'ok':'bad');const entries=[];for(const [k,v] of Object.entries(d)){if(k==='ok'||k==='preview')continue;entries.push(`<div class="row"><div class="key">${k}</div><div class="val">${String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div></div>`)}document.querySelector('#details').innerHTML=entries.join('');if(d.preview){const im=new Image();im.src=d.preview;document.querySelector('#preview').appendChild(im)}}catch(e){document.querySelector('#status').textContent='✕ 진단정보 표시 오류: '+e.message;document.querySelector('#status').className='status bad'}}</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=022').catch(e=>console.log(e))</script></body></html>
