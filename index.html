-actions"><button id="backupExport" class="btn primary" type="button">⬇ 전체 백업</button><label class="btn secondary">↥ 백업 복원<input id="backupFile" type="file" accept="application/json,.json" hidden></label></div><small id="backupStatus">복원 전에는 현재 자료를 안전백업으로 먼저 내려받습니다.</small></section><section id="list" class="list"></section><div id="empty" class="empty"><strong>아직 정리할 게 없어요.</strong><span>사진·텍스트·링크를 공유 → 쫑킵으로 보내면 여기에 들어와요.</span></div></main><div id="brainDump" class="brain-dump hidden"><div class="brain-sheet"><div class="brain-head"><div><strong>🧠 머리 복잡해</strong><small>정리하려 하지 말고 먼저 전부 꺼내세요.</small></div><button id="brainDumpClose" type="button">✕</button></div><section id="brainDumpWrite"><textarea id="brainDumpInput" placeholder="생각나는 걸 한 줄에 하나씩 적어보세요."></textarea><p class="brain-tip">순서·맞춤법·중요도는 생각하지 않아도 돼요. 지금은 꺼내기만.</p><button id="brainDumpNext" class="btn primary full" type="button">다 꺼냈어 → 정리하기</button></section><section id="brainDumpSort" class="hidden"><p class="brain-tip">각 기록에 목록과 중요도를 정하고, 필요하면 오늘로 보내세요.</p><div id="brainDumpRows" class="brain-rows"></div><div class="brain-bottom"><button id="brainDumpBack" class="btn secondary" type="button">← 더 적기</button><button id="brainDumpSave" class="btn primary" type="button">쫑킵에 넣기</button></div></section></div></div><dialog id="editDialog"><div class="edit-card"><div class="edit-head"><strong>기록 수정</strong><button class="icon-btn" onclick="document.querySelector('#editDialog').close()">✕</button></div><textarea id="editText"></textarea><div id="editPhotos" class="edit-photos hidden"></div><label class="btn secondary full">📷 사진 추가<input id="editPhotoInput" type="file" accept="image/*" multiple hidden></label><div id="editTypes" class="type-picker"><button data-type="task">✓ 할 일</button><button data-type="idea">💡 아이디어</button><button data-type="reference" class="active">📚 자료</button></div><label class="today-toggle"><input id="editToday" type="checkbox"> 오늘에 넣기</label><label class="today-toggle"><input id="edit
