<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#234734"><title>쫑글킵 v0.3.2</title><link rel="manifest" href="/manifest.webmanifest?v=031"><link rel="stylesheet" href="/jjongkeep.css?v=033"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/icon-192.png"></head><body><main class="app"><header class="top"><h1>쫑글킵 <small>v0.3.2</small></h1><p>Keep에 모으고, 여기서 정리해서 행동으로.</p></header><section class="quick"><textarea id="quickText" placeholder="직접 적거나, 다른 앱에서 공유해 보내세요."></textarea><div id="photoPreview" class="photo-preview hidden"></div><div class="quick-actions"><label class="btn secondary">📷 사진 선택<input id="photoInput" type="file" accept="image/*" multiple></label><button id="quickSave" class="btn primary">저장</button></div></section><nav class="tabs"><button class="tab active" data-view="inbox">받은 것</button><button class="tab" data-view="today">오늘</button><button class="tab" data-view="archive">보관</button></nav><div class="toolbar"><input id="search" type="search" placeholder="검색"><button id="backupToggle" class="backup-toggle" type="button">🛡️ 백업</button></div><section id="backupPanel" class="backup-panel hidden"><strong>내 자료 백업</strong><p>메모·사진·분류·중요도·오늘·완료 기록을 한 파일에 저장합니다.</p><div class="backup-actions"><button id="backupExport" class="btn primary" type="button">⬇ 전체 백업</button><label class="btn secondary">↥ 백업 복원<input id="backupFile" type="file" accept="application/json,.json" hidden></label></div><small id="backupStatus">복원 전에는 현재 자료를 안전백업으로 먼저 내려받습니다.</small></section><section id="list" class="list"></section><div id="empty" class="empty"><strong>아직 정리할 게 없어요.</strong><span>사진·텍스트·링크를 공유 → 쫑글킵으로 보내면 여기에 들어와요.</span></div></main><dialog id="editDialog"><div class="edit-card"><div class="edit-head"><strong>메모 정리</strong><button class="icon-btn" onclick="document.querySelector('#editDialog').close()">✕</button></div><textarea id="editText"></textarea><div id="editPhotos" class="edit-photos hidden"></div><label class="btn secondary full">📷 사진 추가<input id="editPhotoInput" type="file" accept="image/*" multiple hidden></label><div id="editTypes" class="type-picker"><button data-type="task">✓ 할 일</button><button data-type="idea">💡 아이디어</button><button data-type="reference" class="active">📚 자료</button></div><label class="today-toggle"><input id="editToday" type="checkbox"> 오늘 할 일에 넣기</label><label class="today-toggle"><input id="editArchive" type="checkbox"> 보관하기</label><div class="edit-actions"><button id="editDelete" class="btn danger">삭제</button><button id="editSave" class="btn primary">저장</button></div></div></dialog><div id="photoViewer" class="photo-viewer hidden" aria-hidden="true"><button id="viewerClose" class="viewer-close" aria-label="닫기">✕</button><button id="viewerPrev" class="viewer-nav viewer-prev" aria-label="이전 사진">‹</button><div id="viewerStage" class="viewer-stage"><img id="viewerImage" alt="전체 사진"></div><button id="viewerNext" class="viewer-nav viewer-next" aria-label="다음 사진">›</button><div id="viewerCount" class="viewer-count"></div></div><div id="toast" class="toast"></div><script src="/jjongkeep.js?v=034"></script><script src="/backup.js?v=001"></script></body></html>
