<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#234734"><title>쫑글킵 공유진단 v0.2.2</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/icon-192.png"><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f3;color:#202520;font-family:Arial,'Noto Sans KR',sans-serif}.app{max-width:680px;margin:auto;padding:28px 18px 80px}h1{font-size:30px;margin:0 0 5px}h1 small{font-size:17px;color:#788078}p{line-height:1.6;color:#69716b}.card{margin-top:22px;background:#fff;border:1px solid #dfe4df;border-radius:22px;padding:18px}.status{font-size:20px;font-weight:900;margin-bottom:14px}.row{padding:9px 0;border-bottom:1px solid #edf0ed}.row:last-child{border:0}.key{font-size:12px;color:#818981;margin-bottom:4px}.val{font-size:15px;word-break:break-all;white-space:pre-wrap}.ok{color:#176436}.bad{color:#a62e2e}.hint{margin-top:20px;padding:15px;border-radius:16px;background:#edf3ee;font-size:14px;line-height:1.6}</style></head><body><div class="app"><h1>쫑글킵 <small>공유진단 v0.2.2</small></h1><p>설치와 사진 공유 수신만 확인하는 진단 버전입니다.</p><section class="card"><div id="status" class="status">대기 중</div><div id="details"><div class="row"><div class="key">테스트</div><div class="val">사진 1장 → 공유 → 쫑글킵</div></div></div></section><div class="hint">공유 후 POST 수신 여부, Content-Type, 파일명, MIME, 용량 또는 실제 오류를 표시합니다.</div></div><script>async function show(){try{const r=await caches.open('jjongkeep-diag-results');const x=await r.match('/last-share-result');if(!x)return;const d=await x.json();document.querySelector('#status').textContent=d.ok?'✓ 공유 데이터 읽기 성공':'✕ 공유 처리 오류';document.querySelector('#status').className='status '+(d.ok?'ok':'bad');document.querySelector('#details').innerHTML=Object.entries(d).filter(([k])=>k!=='ok').map(([k,v])=>`<div class="row"><div class="key">${k}</div><div class="val">${String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div></div>`).join('')}catch(e){document.querySelector('#status').textContent='진단 결과 읽기 오류: '+e.message;document.querySelector('#status').className='status bad'}}if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js').then(()=>navigator.serviceWorker.ready).then(show).catch(e=>{document.querySelector('#status').textContent='서비스워커 오류: '+e.message;document.querySelector('#status').className='status bad'})}</script></body></html>
