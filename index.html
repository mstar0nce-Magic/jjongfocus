<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#abd5c2"><title>담다 v1.8.0</title><link rel="manifest" href="/manifest.webmanifest?v=1305"><link rel="stylesheet" href="/jjongkeep.css?v=1400"><link rel="stylesheet" href="/calendar-insights.css?v=1380"><link rel="stylesheet" href="/mandalart-v142.css?v=1480"><link rel="stylesheet" href="/glass-ui.css?v=1820"><link rel="icon" href="/icons/icon-192.png?v=2"><link rel="apple-touch-icon" href="/icons/icon-192.png?v=2"></head><body><main class="app"><header class="top"><div><h1><span class="brand-name">Damada</span><small>v1.8.0</small></h1><p>모든 것은 하나의 기록에서 시작합니다.</p></div><div class="top-actions"><button id="moreOpen" type="button" aria-label="더보기">⋯</button><button id="thoughtOpen" type="button">생각정리</button><button id="calendarOpen" type="button">달력</button><button id="newRecord" class="primary" type="button">＋ 새 기록</button></div></header><section id="normalView"><nav id="categories" class="categories"></nav><section class="records-head"><strong id="viewTitle">인박스</strong><div class="head-actions"><span id="recordCount">0개</span></div></section></section><section id="thoughtView" class="thought-view hidden"><div class="thought-top"><button id="thoughtBack" type="button">← 돌아가기</button><strong>생각정리</strong></div><div class="thought-intro"><strong>머릿속에 있는 걸 먼저 꺼내세요.</strong><p>정리하려고 하지 말고 생각나는 대로 한 줄씩 적어보세요.</p><div class="thought-timer"><span id="thoughtTimer">03:00</span><button id="thoughtTimerToggle" type="button">시작</button><button id="thoughtTimerReset" type="button">초기화</button></div></div><div id="thoughtInputs" class="thought-inputs"></div><button id="thoughtAdd" type="button">＋ 생각 한 줄 추가</button><button id="thoughtDone" class="primary thought-done" type="button">다 꺼냈어</button></section><section id="calendarView" class="calendar-view hidden"><div class="calendar-top"><button id="calendarBack" type="button">← 돌아가기</button><strong id="calendarTitle"></strong></div><div class="calendar-mode"><button id="calendarMonthMode" class="active" type="button">월간</button><button id="calendarWeekMode" type="button">주간</button></div><div class="calendar-nav"><button id="calendarPrev" type="button">‹</button><strong id="calendarRangeTitle"></strong><button id="calendarNext" type="button">›</button></div><div class="calendar-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendarGrid" class="calendar-grid"></div><div class="calendar-list-head"><div class="calendar-list-summary"><strong id="calendarListTitle">이번 달 기록</strong><span id="calendarCount">0개</span></div><div class="calendar-list-actions"><button id="calendarToday" type="button">오늘</button><button id="calendarAdd" class="primary" type="button">＋ 등록</button></div></div></section><div id="bulkBar" class="bulk-bar hidden"><span id="selectedCount">0개 선택</span><button id="bulkCancel" type="button">취소</button><button id="bulkDelete" type="button" class="danger">삭제</button></div><section id="list" class="list"></section><div id="empty" class="empty">아직 기록이 없어요.</div></main><nav class="bottom-nav" aria-label="주요 메뉴"><button id="bottomCalendar" type="button"><span class="nav-icon"><svg class="nav-svg" viewBox="0 0 32 32" aria-hidden="true"><rect x="5.5" y="7.5" width="21" height="19" rx="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10 5.5v5M22 5.5v5M5.8 13h20.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="11" cy="18" r="1.25" fill="currentColor"/><circle cx="16" cy="18" r="1.25" fill="currentColor"/><circle cx="21" cy="18" r="1.25" fill="currentColor"/><circle cx="11" cy="23" r="1.25" fill="currentColor"/><circle cx="16" cy="23" r="1.25" fill="currentColor"/></svg></span><span>달력</span></button><button id="bottomRecords" class="active" type="button"><span class="nav-icon"><svg class="nav-svg" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 5.5h16a2.5 2.5 0 0 1 2.5 2.5v16a2.5 2.5 0 0 1-2.5 2.5H8A2.5 2.5 0 0 1 5.5 24V8A2.5 2.5 0 0 1 8 5.5Z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10.5 11h11M10.5 16h11M10.5 21h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><span>기록</span></button><button id="bottomNew" type="button"><span class="nav-icon">＋</span><span>새 기록</span></button><button id="bottomMore" type="button"><span class="nav-icon">☰</span><span>더보기</span></button></nav><div id="editor" class="modal hidden" role="dialog" aria-modal="true"><div class="editor"><header><strong id="editorTitle">새 기록</strong><button id="closeEditor" type="button" class="round">✕</button></header><div id="blocks" class="blocks"></div><div class="add-blocks"><button id="addText" type="button">＋ 글</button><label>＋ 사진<input id="addImage" type="file" accept="image/*" multiple hidden></label></div><div class="editor-fields"><label>카테고리 <select id="categorySelect"><option value="">인박스 (미지정)</option></select></label><label>시작 날짜 · 시간 <input id="recordStartDate" type="datetime-local"></label><label>끝 날짜 · 시간 <input id="recordEndDate" type="datetime-local"></label></div><footer><button id="deleteRecord" type="button" class="danger">삭제</button><button id="saveRecord" type="button" class="primary">저장</button></footer></div></div><div id="categoryDialog" class="modal hidden"><div class="category-dialog"><header><strong>카테고리 관리</strong><button id="closeCategories" type="button" class="round">✕</button></header><div id="categoryManage"></div><div class="category-new"><input id="newCategoryName" placeholder="새 카테고리 이름"><button id="addCategory" type="button" class="primary">추가</button></div></div></div><div id="toast" class="toast"></div><script src="/jjongkeep.js?v=1362"></script><script src="/card-tools.js?v=1371"></script><script src="/card-view.js?v=1820"></script><script src="/swipe-calendar.js?v=1620"></script><script src="/thought-organizer.js?v=1303"></script><script src="/date-picker.js?v=1341"></script><script src="/mandalart.js?v=14110"></script><script src="/more-tools.js?v=1810"></script><script>(()=>{const grid=document.getElementById('calendarGrid');if(grid){const sync=()=>grid.querySelectorAll('.day-count').forEach(el=>{const n=parseInt(el.textContent,10);if(Number.isFinite(n))el.dataset.count=String(n)});new MutationObserver(sync).observe(grid,{childList:true,subtree:true});sync()}const records=document.getElementById('bottomRecords'),calendar=document.getElementById('bottomCalendar'),newBtn=document.getElementById('bottomNew'),more=document.getElementById('bottomMore');const setActive=name=>{records?.classList.toggle('active',name==='records');calendar?.classList.toggle('active',name==='calendar')};records?.addEventListener('click',()=>{if(!document.getElementById('calendarView')?.classList.contains('hidden'))document.getElementById('calendarBack')?.click();else if(!document.getElementById('thoughtView')?.classList.contains('hidden'))document.getElementById('thoughtBack')?.click();setActive('records')});calendar?.addEventListener('click',()=>{if(document.getElementById('calendarView')?.classList.contains('hidden'))document.getElementById('calendarOpen')?.click();setActive('calendar')});newBtn?.addEventListener('click',()=>document.getElementById('newRecord')?.click());more?.addEventListener('click',()=>document.getElementById('moreOpen')?.click());document.getElementById('calendarOpen')?.addEventListener('click',()=>{setActive('calendar');requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}))});document.getElementById('calendarBack')?.addEventListener('click',()=>setActive('records'))})();</script></body></html>
