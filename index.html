<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#234734">
  <title>담다 v1.0.0</title>
  <link rel="manifest" href="/manifest.webmanifest?v=100">
  <link rel="stylesheet" href="/jjongkeep.css?v=100">
  <link rel="icon" href="/icons/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>담다 <small>v1.0.0</small></h1>
      <p>새로운 담다를 시작합니다.</p>
    </header>

    <section class="keep-import">
      <strong>Google Keep에서 가져오기</strong>
      <p>Google Keep에서 텍스트·링크·사진을 공유하면 이곳에 그대로 담깁니다.</p>
      <div id="importStatus" class="status">공유를 기다리고 있어요.</div>
    </section>

    <section class="records-head">
      <strong>가져온 자료</strong>
      <span id="recordCount">0개</span>
    </section>
    <section id="list" class="list"></section>
    <div id="empty" class="empty">아직 가져온 자료가 없어요.</div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/jjongkeep.js?v=100"></script>
</body>
</html>
