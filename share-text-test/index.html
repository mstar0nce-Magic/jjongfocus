<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#234734"><title>쫑글킵 텍스트 공유 테스트</title><link rel="manifest" href="/share-text-test/manifest.webmanifest?v=1"><link rel="icon" href="/icons/icon-192.png"><style>body{font-family:Arial,sans-serif;background:#f6f7f3;color:#1f2421;margin:0;padding:24px}.box{max-width:620px;margin:auto;background:white;border:1px solid #dfe5df;border-radius:20px;padding:20px}h1{font-size:24px}.ok{padding:12px;border-radius:12px;background:#edf3ee;white-space:pre-wrap;word-break:break-word}</style></head><body><div class="box"><h1>쫑글킵 텍스트 공유 테스트</h1><p>본 쫑글킵과 분리된 텍스트/링크 공유 등록 테스트입니다.</p><div id="result" class="ok">아직 공유받은 내용 없음</div></div><script>const p=new URLSearchParams(location.search);const vals=[p.get('title'),p.get('text'),p.get('url')].filter(Boolean);if(vals.length)document.querySelector('#result').textContent=vals.join('\n\n');if(location.pathname.endsWith('/receive')&&vals.length===0)document.querySelector('#result').textContent='공유 대상은 열렸지만 전달된 텍스트가 없습니다.';</script></body></html>
